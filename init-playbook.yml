- name: vagrant provisioning
  hosts: localhost # all / localhost
  become: yes
  tasks:
    - name: timezoneを設定
      timezone:
        name: Asia/Tokyo

    - name: 電源ボタンを無効化
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: '^#?HandlePowerKey='
        line: 'HandlePowerKey=ignore'

    - name: systemd-logindを再起動
      systemd:
        name: systemd-logind
        state: restarted

    - name: Add rm safety wrapper
      blockinfile:
        path: /etc/bash.bashrc
        block: |
          # Protect against accidental rm -rf /
          rm() {
              for arg in "$@"; do
                  if [[ "$arg" == "/" ]]; then
                      echo "ERROR: Dangerous rm pattern blocked: rm $*"
                      echo "Use /bin/rm if intentional"
                      return 1
                  fi
              done
              command rm "$@"
          }

    - name: ユーザを追加
      user:
        uid: 9066
        name: kkano
        shell: /bin/bash

    - name: 公開鍵の登録
      authorized_key:
        user: kkano
        key: "ssh-rsa "

    - name: ユーザをsudoersに登録
      copy:
        content: |
          kkano ALL=(ALL) NOPASSWD: ALL
        dest: /etc/sudoers.d/kkano
        mode: '0440'

    - name: enable-lingerを有効化
      command: loginctl enable-linger kkano

    - name: .gitconfigを作成
      copy:
        dest: /home/kkano/.gitconfig
        owner: kkano
        group: kkano
        content: |
          [core]
            editor = vim
            quotepath = false
            autocrlf = false                                # デフォルトfalseだがWin-Gitはデフォルトtrue Windowsで使う場合はtrue リポジトリを汚したくないので
          [color]
            ui = auto
          [user]
            name = Kenichi KANOH
            email = k.kanoh@cixi.sakura.ne.jp
          [pull]
            rebase = true                                   # SVNのようにHEADにローカルコミットを乗せる falseだとpull時にローカルコミットをマージするマージコミットを作る
          [merge]
            ff = false                                      # merge時にffでもマージコミットを作る 変なログにしたくないので squash mergeする時は--ffを付ける
          [fetch]
            prune = true                                    # リモートブランチが消えたら追跡ブランチも自動で消す (local)aaa:(追跡)origin/aaa:(remote)aaaの関係
          [rebase]
            autosquash = true                               # rebase時にfixup!コミットを自動で並べ替える rebase -i [--autosquash]を省略できる
            rebaseMerges = true                             # rebase時にマージコミットを残す rebase -i [--rebase-merges]を省略できる
          [alias]
            rm2 = rm --cached                               # インデックスから削除 ファイルを残す --cachedなしだとファイルも消える
            pushf = push --force
            ncommit = commit --allow-empty-message -m \"\"
            r10 = rebase -i @~10
            r20 = rebase -i @~20
            rabo = rebase --abort
            rcon = rebase --continue
            rsame = rebase --committer-date-is-author-date
