- name: vagrant provisioning
  hosts: localhost # all / localhost
  become: yes
  tasks:
    - name: timezoneを設定
      timezone:
        name: Asia/Tokyo

    - name: 電源ボタンを無効化
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: '^#?HandlePowerKey='
        line: 'HandlePowerKey=ignore'

    - name: systemd-logindを再起動
      systemd:
        name: systemd-logind
        state: restarted

    - name: Add rm safety wrapper
      blockinfile:
        path: /etc/bash.bashrc
        block: |
          # Protect against accidental rm -rf /
          rm() {
              for arg in "$@"; do
                  if [[ "$arg" == "/" ]]; then
                      echo "ERROR: Dangerous rm pattern blocked: rm $*"
                      echo "Use /bin/rm if intentional"
                      return 1
                  fi
              done
              command rm "$@"
          }

    - name: ユーザを追加
      user:
        uid: 9066
        name: kkano
        shell: /bin/bash

    - name: 公開鍵の登録
      authorized_key:
        user: kkano
        key: "ssh-rsa "

    - name: ユーザをsudoersに登録
      copy:
        content: "kkano ALL=(ALL) NOPASSWD: ALL"
        dest: /etc/sudoers.d/kkano
        mode: 0440

    - name: enable-lingerを有効化
      command: loginctl enable-linger kkano

    - name: .gitconfigを作成
      copy:
        dest: /home/kkano/.gitconfig
        owner: kkano
        group: kkano
        content: |
          [core]
            editor = vim
            quotepath = false
          [color]
            ui = auto
          [user]
            name = Kenichi KANOH
            email = k.kanoh@cixi.sakura.ne.jp
          [pull]
            rebase = false
          [merge]
            ff = false
          [fetch]
            prune = true
          [rebase]
            autosquash = true
          [alias]
            rm2 = rm --cached
            pushf = push --force
            ncommit = commit --allow-empty-message -m \"\"
            r10 = rebase -i @~10
            r20 = rebase -i @~20
            rabo = rebase --abort
            rcon = rebase --continue
            rsame = rebase --committer-date-is-author-date
